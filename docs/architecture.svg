<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    .box { fill:#f8fafc; stroke:#0f172a; stroke-width:1.5; rx:8; }
    .title { font: bold 16px sans-serif; fill:#0f172a }
    .label { font: 12px sans-serif; fill:#0f172a }
    .arrow { stroke:#0f172a; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="40" width="200" height="120" class="box"/>
  <text x="140" y="70" text-anchor="middle" class="title">Cliente (Next.js)</text>
  <text x="140" y="92" text-anchor="middle" class="label">AuthContext, UI, Stripe Elements</text>

  <!-- Backend -->
  <rect x="340" y="30" width="220" height="160" class="box"/>
  <text x="450" y="60" text-anchor="middle" class="title">Backend API (Node/Express)</text>
  <text x="450" y="86" text-anchor="middle" class="label">/api/payments/* — stripe.controller.js</text>

  <!-- Database -->
  <rect x="640" y="40" width="200" height="120" class="box"/>
  <text x="740" y="70" text-anchor="middle" class="title">Base de datos (Mongo)</text>
  <text x="740" y="92" text-anchor="middle" class="label">Users, Wallets, Transactions</text>

  <!-- Stripe -->
  <rect x="340" y="220" width="220" height="120" class="box"/>
  <text x="450" y="250" text-anchor="middle" class="title">Stripe</text>
  <text x="450" y="274" text-anchor="middle" class="label">PaymentIntent, webhooks (opcional)</text>

  <!-- Arrows -->
  <path d="M240 100 L340 100" class="arrow" />
  <path d="M560 100 L640 100" class="arrow" />

  <path d="M450 190 L450 220" class="arrow" />
  <path d="M450 340 L740 340" class="arrow" />

  <!-- Labels on arrows -->
  <text x="300" y="88" class="label">POST /api/payments/create-payment-intent</text>
  <text x="510" y="88" class="label">DB updates (wallet)</text>
  <text x="470" y="210" class="label">Stripe API requests</text>
  <text x="610" y="350" class="label">Store transactions</text>
</svg>
